<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Keputusan FSB Johor 2026</title>
<link rel="stylesheet" href="../assets/ui.css">
<style>
.rs-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--paper); margin-bottom: 8px; }
.rs-rank { flex: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 800 22px var(--font-display); background: var(--line); color: var(--ink); }
.rs-rank.r1 { background: var(--yellow); color: var(--on-yellow); }
.rs-rank.r2 { background: var(--blue); color: #fff; }
.rs-rank.r3 { background: var(--magenta); color: #fff; }
.rs-id { font: 800 26px var(--font-display); }
.rs-name { color: var(--muted); }
.rs-tier { font: 700 14px var(--font-ui); color: var(--muted); margin: 12px 0 6px; }
</style>
</head>
<body>
<div class="app" id="root"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
